<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EuropeanValues - Instructions</title>
    <link href="style.css" rel="stylesheet" type="text/css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="shortcut icon" type="image/svg+xml" href="icon.svg">
    <script src="theme.js"></script>
</head>
<body>
    <button class="theme-toggle-corner" onclick="toggleTheme()" aria-label="Toggle light/dark mode">
        <svg width="80" height="80" viewBox="0 0 250 250" aria-hidden="true">
            <path d="M0,0 L250,250 L250,0 Z"></path>
            <g class="icon-sun" transform="translate(142, 52) scale(2.2)">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </g>
            <g class="icon-moon" transform="translate(142, 52) scale(2.2)">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
            </g>
        </svg>
    </button>

    <h1 style="margin-top: 1rem;">EuropeanValues</h1>
    <hr>
    <h2 style="text-align: center; margin-top: 0;">Instructions</h2>

    <div class="question-card" style="font-size: 1.25rem;">
        You will be presented with a series of political and social statements. For each one, click the button that best reflects your honest opinion.
    </div>

    <div class="button-container">
        <button class="button" onclick="location.href='quiz.html';" style="font-size: 1.2rem;">Got it, start quiz!</button>
        <button class="button" onclick="location.href='index.html';">Wait, nevermind!</button>
    </div>

</body>
</html>
